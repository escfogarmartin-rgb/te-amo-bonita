<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  html, body { margin: 0; height: 100%; }
  * { box-sizing: border-box; }

  .m8-outer {
    width: 100%;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }

  /* ================= SHARED ANIMATED LANDSCAPE ================= */
  .m8-landscape {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .m8-sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #3f8cf2 0%,
      #6f8ff0 22%,
      #b48af0 45%,
      #e8b4d8 62%,
      #f6cf9e 74%,
      #8b7a95 82%
    );
  }

  .m8-cloud-layer {
    position: absolute;
    top: 30%;
    left: 0;
    width: 220%;
    display: flex;
    align-items: flex-end;
    gap: 260px;
    animation: m8-drift 40s linear infinite;
  }

  @keyframes m8-drift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .m8-pink-cloud {
    width: 90px;
    height: 34px;
    background: #f6b8d6;
    flex-shrink: 0;
    clip-path: polygon(
      6% 100%, 6% 65%, 20% 65%, 20% 35%, 38% 35%, 38% 10%,
      62% 10%, 62% 35%, 80% 35%, 80% 65%, 94% 65%, 94% 100%
    );
    box-shadow: inset -6px -6px 0 rgba(255,255,255,0.35);
  }

  .m8-pink-cloud.small { width: 46px; height: 18px; opacity: 0.85; }

  .m8-grass-top {
    position: absolute;
    bottom: 26%;
    left: -20%;
    width: 140%;
    height: 10px;
    background-color: #c9c235;
    background-image:
      repeating-linear-gradient(65deg, #7a3b1e 0 3px, transparent 3px 7px),
      repeating-linear-gradient(115deg, #7a3b1e 0 3px, transparent 3px 7px);
    animation: m8-sway 5s linear infinite;
  }

  @keyframes m8-sway {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 14px 0, -14px 0; }
  }

  .m8-grass-field {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 26%;
    background: linear-gradient(180deg, #c9c235 0%, #8a9a2a 35%, #4a6b1e 100%);
  }

  /* ================= START SCREEN ================= */
  .m8-start {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 34px 16px 24px;
  }

  .m8-start.hidden { display: none; }

  .m8-title {
    font-size: clamp(18px, 4vw, 28px);
    color: #ffe66d;
    text-align: center;
    line-height: 1.7;
    text-shadow: 3px 3px 0 #1a0f3d;
    margin-bottom: 6px;
  }

  .m8-tagline {
    font-size: 9px;
    color: #3a2a5e;
    background: rgba(255,255,255,0.55);
    padding: 4px 10px;
    border-radius: 4px;
    text-align: center;
    margin-bottom: 10px;
  }

  .m8-char-stage {
    width: 260px;
    height: 420px;
    margin: 10px auto 0;
    flex: 1;
    max-height: 46vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .m8-char {
    height: 100%;
    width: auto;
    max-width: none;
    display: block;
    animation: m8-bounce 2.6s ease-in-out infinite;
    transform-origin: bottom center;
    filter:
      drop-shadow(0 10px 10px rgba(10, 5, 30, 0.35))
      drop-shadow(0 0 22px rgba(255, 230, 109, 0.35));
  }

  @keyframes m8-bounce {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25% { transform: translateY(-10px) rotate(-1.6deg) scale(1.01); }
    50% { transform: translateY(0) rotate(0deg) scale(1); }
    75% { transform: translateY(-5px) rotate(1.6deg) scale(1.005); }
  }

  .m8-char-shadow {
    width: 130px;
    height: 18px;
    margin: -8px auto 18px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, transparent 75%);
    animation: m8-shadow-pulse 2.6s ease-in-out infinite;
  }

  @keyframes m8-shadow-pulse {
    0%, 100% { transform: scaleX(1); opacity: 0.5; }
    50% { transform: scaleX(0.82); opacity: 0.3; }
  }

  .m8-play-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 18px);
    letter-spacing: 2px;
    color: #ffffff;
    background: linear-gradient(180deg, #7a7a7a 0%, #5a5a5a 50%, #444 100%);
    border: 4px solid #2b2b2b;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.35),
      inset -3px -3px 0 rgba(0,0,0,0.35),
      4px 4px 0 #1a1a1a;
    padding: 14px 44px;
    cursor: pointer;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 12px;
  }

  .m8-play-btn:active {
    transform: translate(3px, 3px);
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.35),
      inset -3px -3px 0 rgba(0,0,0,0.35),
      1px 1px 0 #1a1a1a;
  }

  /* ================= GAME SCREEN ================= */
  .m8-game {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 22px 14px 40px;
    color: #f1eaff;
    text-align: center;
  }

  .m8-game.hidden { display: none; }

  .m8-panel {
    background: rgba(20, 12, 45, 0.55);
    backdrop-filter: blur(3px);
    border-radius: 18px;
    padding: 20px 16px 28px;
    width: 100%;
    max-width: 900px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08), 0 16px 40px rgba(0,0,0,0.4);
  }

  .m8-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
  }

  .m8-avatar { width: 42px; height: 42px; flex-shrink: 0; }

  .m8-header-title {
    font-size: 15px;
    letter-spacing: 1px;
    color: #ffe66d;
    text-shadow: 3px 3px 0 #1a0f3d;
    line-height: 1.6;
  }

  .m8-subtitle {
    font-size: 8px;
    color: #c9b8ff;
    margin: 10px 0 20px;
    letter-spacing: 0.5px;
  }

  .m8-stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 20px;
    font-size: 9px;
    color: #ffe66d;
  }

  .m8-stats span { color: #f1eaff; }

  .m8-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    margin: 0 auto;
  }

  @media (max-width: 700px) {
    .m8-board { grid-template-columns: repeat(4, 1fr); }
    .m8-header-title { font-size: 12px; }
  }

  .m8-card {
    aspect-ratio: 1 / 1;
    perspective: 600px;
    cursor: pointer;
  }

  .m8-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }

  .m8-card.flipped .m8-card-inner,
  .m8-card.matched .m8-card-inner {
    transform: rotateY(180deg);
  }

  .m8-face {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10%;
  }

  .m8-back {
    background: linear-gradient(145deg, #7b4fd6, #3d2170);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15), 0 3px 0 rgba(0,0,0,0.35);
  }

  .m8-front {
    background: linear-gradient(145deg, #2a1a5e, #150c33);
    transform: rotateY(180deg);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1), 0 3px 0 rgba(0,0,0,0.35);
  }

  .m8-card.matched .m8-front {
    box-shadow: inset 0 0 0 2px #ffe66d, 0 0 14px rgba(255,230,109,0.6);
  }

  .m8-card:not(.flipped):not(.matched):active .m8-card-inner {
    transform: scale(0.93);
  }

  .pixel-grid {
    display: grid;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .pixel-grid > div { width: 100%; height: 100%; }

  .m8-win {
    margin-top: 22px;
    font-size: 11px;
    color: #ffe66d;
    line-height: 2;
    display: none;
  }

  .m8-win.show { display: block; }

  .m8-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    background: #ffe66d;
    color: #2d1b69;
    border: none;
    border-radius: 6px;
    padding: 12px 16px;
    cursor: pointer;
    box-shadow: 0 4px 0 #b8942f;
    margin-top: 16px;
  }

  .m8-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b8942f;
  }

  /* ================= COLLECTION / ALBUM ================= */
  .m8-collection {
    margin-top: 30px;
    width: 100%;
  }

  .m8-collection-title {
    font-size: 11px;
    color: #ffe66d;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .m8-collection-hint {
    font-size: 7px;
    color: #c9b8ff;
    margin-bottom: 14px;
  }

  .m8-collection-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
  }

  @media (max-width: 700px) {
    .m8-collection-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .m8-collect-item {
    aspect-ratio: 1 / 1;
    perspective: 600px;
  }

  .m8-collect-item.unlocked { cursor: pointer; }

  .m8-collect-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }

  .m8-collect-item.flipped .m8-collect-inner {
    transform: rotateY(180deg);
  }

  .m8-collect-face {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10%;
  }

  .m8-collect-front {
    background: repeating-linear-gradient(45deg, #241a3d, #241a3d 4px, #2c2050 4px, #2c2050 8px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
  }

  .m8-collect-item.unlocked .m8-collect-front {
    background: linear-gradient(145deg, #2a1a5e, #150c33);
    box-shadow: inset 0 0 0 2px #ffe66d, 0 0 10px rgba(255,230,109,0.45);
  }

  .m8-collect-back {
    background: linear-gradient(145deg, #3d2170, #1c1040);
    transform: rotateY(180deg);
    box-shadow: inset 0 0 0 2px rgba(255,230,109,0.35);
    padding: 8%;
  }

  .m8-collect-note {
    width: 100%;
    height: 100%;
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    line-height: 1.6;
    color: #fdf8ff;
    background: transparent;
    border: none;
    outline: none;
    overflow-y: auto;
    text-align: left;
  }

  .m8-collect-note:empty:before {
    content: attr(data-placeholder);
    color: rgba(255,255,255,0.4);
  }

/* ================= RESPONSIVE EXTRA ================= */

<script>
(function () {
  // ---------- pixel art renderer ----------
  function renderPixelArt(rows, palette) {
    const cols = rows[0].length;
    let html = `<div class="pixel-grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows.length},1fr);">`;
    for (const row of rows) {
      for (const ch of row) {
        const color = palette[ch] || 'transparent';
        html += `<div style="background:${color}"></div>`;
      }
    }
    html += '</div>';
    return html;
  }

  function mirror(leftHalf) {
    return leftHalf + leftHalf.split('').reverse().join('');
  }

  function overrideChar(row, index, ch) {
    return row.slice(0, index) + ch + row.slice(index + 1);
  }

  // ---------- landscape: pink clouds ----------
  const cloudLayer = document.getElementById('m8-cloud-layer');
  const cloudPattern = ['', 'small', '', '', 'small', '', ''];
  cloudPattern.forEach((size) => {
    const c = document.createElement('div');
    c.className = 'm8-pink-cloud' + (size ? ' ' + size : '');
    cloudLayer.appendChild(c);
  });

  // ---------- game icon definitions (10x10 grids) ----------
  const apple = {
    rows: [
      "....SS....",
      "...LSS....".slice(0,10),
      "....DD....",
      "..DRRRRD..",
      ".DRRRRRRD.",
      "DRRRRRRRRD",
      "DRRRRRRRRD",
      "DRRRRRRRRD",
      ".DRRRRRRD.",
      "..DDDDDD..",
    ],
    palette: { S: '#6b4226', L: '#4caf50', D: '#7a1f2b', R: '#e63946' }
  };

  const orange = {
    rows: [
      "....LL....",
      "....SS....",
      "....DD....",
      "..DOOOOD..",
      ".DOOOOOOD.",
      "DOOOOOOOOD",
      "DOOOOOOOOD",
      "DOOOOOOOOD",
      ".DOOOOOOD.",
      "..DDDDDD..",
    ],
    palette: { L: '#4caf50', S: '#6b4226', D: '#b45309', O: '#ff9f1c' }
  };

  const star = {
    rows: [

  // ================= COLLECTION / ALBUM =================
  const collectSlots = {};
  const noteCache = {};

  async function loadNote(key) {
    try {
      const res = await window.storage.get('note:' + key, false);
      return res && typeof res.value === 'string' ? res.value : '';
    } catch (e) {
      return '';
    }
  }

  async function saveNote(key, text) {
    try {
      await window.storage.set('note:' + key, text, false);
    } catch (e) {
      // no persistent storage available in this environment; note stays only in memory
    }
  }

  function initCollection() {
    const grid = document.getElementById('m8-collection-grid');
    grid.innerHTML = '';

    Object.keys(ICONS).forEach((key) => {
      const item = document.createElement('div');
      item.className = 'm8-collect-item locked';
      item.dataset.icon = key;

      const inner = document.createElement('div');
      inner.className = 'm8-collect-inner';

      const front = document.createElement('div');
      front.className = 'm8-collect-face m8-collect-front';
      front.innerHTML = renderPixelArt(questionMark.rows, questionMark.palette);

      const back = document.createElement('div');
      back.className = 'm8-collect-face m8-collect-back';
      const note = document.createElement('div');
      note.className = 'm8-collect-note';
      note.contentEditable = 'true';
      note.setAttribute('data-placeholder', 'Escribe algo aqui...');
      note.textContent = noteCache[key] || '';
      note.addEventListener('click', (e) => e.stopPropagation());
      note.addEventListener('blur', () => saveNote(key, note.textContent));
      back.appendChild(note);

      inner.appendChild(front);
      inner.appendChild(back);
      item.appendChild(inner);

      item.addEventListener('click', () => {
        if (!item.classList.contains('unlocked')) return;
        item.classList.toggle('flipped');
      });

      grid.appendChild(item);
      collectSlots[key] = { item, front, note };
    });
  }

  function unlockCollectionPiece(key) {
    const slot = collectSlots[key];
    if (!slot || slot.item.classList.contains('unlocked')) return;
    slot.item.classList.remove('locked');
    slot.item.classList.add('unlocked');
    slot.front.innerHTML = renderPixelArt(ICONS[key].rows, ICONS[key].palette);
  }

  function relockCollection() {
    Object.keys(collectSlots).forEach((key) => {
      const slot = collectSlots[key];
      slot.item.classList.remove('unlocked', 'flipped');
      slot.item.classList.add('locked');
      slot.front.innerHTML = renderPixelArt(questionMark.rows, questionMark.palette);
    });
  }

  charStage.appendChild(charImg);

  // ---------- screen transition ----------
  const startScreen = document.getElementById('m8-start');
  const gameScreen = document.getElementById('m8-game');
  document.getElementById('m8-play-btn').addEventListener('click', () => {
    startScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
  });

  // ---------- memory game logic ----------
  const boardEl = document.getElementById('m8-board');
  const movesEl = document.getElementById('m8-moves');
  const pairsEl = document.getElementById('m8-pairs');
  const winEl = document.getElementById('m8-win');
  const finalMovesEl = document.getElementById('m8-final-moves');
  const restartBtn = document.getElementById('m8-restart');

  const TOTAL_PAIRS = Object.keys(ICONS).length;

  let moves = 0;
  let matchedPairs = 0;
  let lock = false;
  let firstCard = null;
  let secondCard = null;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    moves = 0;
    matchedPairs = 0;
    firstCard = null;
    secondCard = null;
    lock = false;
    movesEl.textContent = '0';
    pairsEl.textContent = '0/' + TOTAL_PAIRS;
    winEl.classList.remove('show');
    relockCollection();

    const keys = Object.keys(ICONS);
    const deck = shuffle([...keys, ...keys]);

    deck.forEach((key) => {
      const card = document.createElement('div');
      card.className = 'm8-card';
      card.dataset.icon = key;

      const inner = document.createElement('div');
      inner.className = 'm8-card-inner';

      const back = document.createElement('div');
      back.className = 'm8-face m8-back';
      back.innerHTML = renderPixelArt(questionMark.rows, questionMark.palette);

      const front = document.createElement('div');
      front.className = 'm8-face m8-front';
      front.innerHTML = renderPixelArt(ICONS[key].rows, ICONS[key].palette);

      inner.appendChild(back);
      inner.appendChild(front);
      card.appendChild(inner);
      card.addEventListener('click', () => onCardClick(card));
      boardEl.appendChild(card);
    });
  }

  function onCardClick(card) {
    if (lock) return;
    if (card === firstCard) return;
    if (card.classList.contains('matched')) return;

    card.classList.add('flipped');

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    lock = true;
    moves++;
    movesEl.textContent = String(moves);

    if (firstCard.dataset.icon === secondCard.dataset.icon) {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      matchedPairs++;
      pairsEl.textContent = matchedPairs + '/' + TOTAL_PAIRS;
      unlockCollectionPiece(firstCard.dataset.icon);
      resetTurn();
      if (matchedPairs === TOTAL_PAIRS) {
        setTimeout(() => {
          finalMovesEl.textContent = 'Lo lograste en ' + moves + ' movimientos';
          winEl.classList.add('show');
        }, 400);
      }
    } else {
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetTurn();
      }, 800);
    }
  }

  function resetTurn() {
    firstCard = null;
    secondCard = null;
    lock = false;
  }

  restartBtn.addEventListener('click', buildBoard);

  (async function start() {
    const keys = Object.keys(ICONS);
    for (const key of keys) {
      noteCache[key] = await loadNote(key);
    }
    initCollection();
    buildBoard();
  })();
})();
